[pytest]
# --testmon: pytest-testmon tracks, per test, exactly which lines of code
# it executed (via coverage.py under the hood). On the NEXT run, it only
# re-runs tests whose tracked code (or the test itself) changed since the
# last successful run - so a plain `pytest` locally becomes "only run
# what my last edit could plausibly have broken" instead of the full
# suite every time.
#
# This lives in addopts (applied to every bare `pytest` invocation)
# rather than being something you have to remember to type. See
# USAGE.md's "Running tests" section for:
#   - how to force a full run (`pytest --testmon-noselect`, or just
#     delete .testmondata)
#   - why CI (tests.yml) explicitly overrides this with
#     --testmon-noselect and always runs everything
addopts = --testmon