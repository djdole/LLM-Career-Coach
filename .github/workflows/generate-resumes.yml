name: Generate resumes and cover letters

# Regenerates the baseline (no-specific-JD) resume and cover letter files
# whenever the knowledge base changes, and opens a PR with the results
# instead of pushing straight to main. Job-tailored resumes for a specific
# posting are a separate, manual, per-application workflow (done in chat)
# and are NOT handled by this file.
#
# Uses a self-hosted LiteLLM proxy (in front of Ollama, per that stack's
# docker-compose.yml) instead of a paid API, so this workflow never spends
# API credits and never fails due to account balance/credits.
#
# NETWORK REACHABILITY -- read before enabling:
# `runs-on: ubuntu-latest` below uses GitHub's hosted runners, which live
# on the public internet. They can only reach your LiteLLM instance if it's
# exposed via something like a Cloudflare Tunnel, Tailscale Funnel, or a
# reverse proxy with auth in front of it (set LITELLM_BASE_URL to that
# public address, pointing at ${LITELLM_PORT} -- NOT Open WebUI's UI port).
# If you'd rather not expose it at all, install a self-hosted GitHub
# Actions runner on the same network as that stack (Settings -> Actions ->
# Runners -> New self-hosted runner) and change `runs-on: ubuntu-latest` to
# `runs-on: self-hosted` below -- then LITELLM_BASE_URL can just be a plain
# LAN address (e.g. http://192.168.x.x:4000).

on:
  pull_request:
    types: [closed] # fires when a PR closes; the job-level `if` below narrows this to merged-only
    branches: [main]
    paths:
      - "data/resume_data.json"
  workflow_dispatch: {} # allows manually re-running from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-resumes
  cancel-in-progress: true

jobs:
  generate:
    # `pull_request: types: [closed]` fires on every closed PR, merged or not --
    # a merge is just one way to close one. This condition is what actually
    # restricts the job to real merges (skipped for closed-without-merging),
    # while still allowing manual re-runs from the Actions tab.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest # see network reachability note above before changing to self-hosted
    timeout-minutes: 15 # fail fast instead of hanging if LiteLLM is unreachable
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # The pull_request event's default checkout ref is the PR branch's
          # last commit, NOT the resulting merge commit on main. Pin to main
          # explicitly so this always builds from the post-merge state.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate baseline outputs
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
        run: python scripts/generate_resumes.py --data data/resume_data.json --out generated/

      - name: Open pull request with regenerated files
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Regenerate resumes and cover letters from updated knowledge base"
          branch: auto/regenerate-resumes
          delete-branch: true
          title: "Auto: regenerate resumes/cover letters from resume_data.json"
          body: |
            Triggered by a change to `data/resume_data.json`.

            Generated via self-hosted LiteLLM/Ollama (model: ${{ vars.LITELLM_MODEL }}).
            This PR was opened automatically and was **not** reviewed by a human yet.
            Please read the diff in `generated/` before merging: local-model output
            can drift more than a hosted model's (odd phrasing, malformed sections,
            reordered bullets) -- worth a closer skim than usual.
          labels: automated-pr