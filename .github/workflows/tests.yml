name: Tests

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main, so a merge that bypasses PR review
  # (or a merge queue) still gets a signal on the resulting commit.
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -q \
            --cov=lib --cov=knowledge_manager --cov=tools --cov=loaders --cov=main --cov=ai_io \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: pytest results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 14

      - name: Code coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          # fail_below_min is intentionally left unset (defaults to false):
          # thresholds below only color the badge/indicators, they don't fail
          # the job. Repo coverage currently sits around 99%; main.py stays
          # slightly below 100% because a few of its lines are either dead
          # code or a deliberately-untested infinite retry loop -- see
          # tests/test_main_run_mission.py for details on each one.
          thresholds: "60 80"

      - name: Post coverage summary to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      # Everything below only runs on a direct push to main (i.e. after a PR
      # merges), never on the pull_request trigger. Committing generated
      # badge SVGs back to a PR branch on every push would create noisy,
      # unreviewable diffs and can conflict with the PR author's own commits;
      # doing it once on main keeps main's badges accurate without touching
      # PR branches at all.
      - name: Generate coverage and test badges
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p badges
          # --local uses genbadge's bundled SVG template instead of calling
          # the shields.io API. Avoids the badge silently breaking (or, worse,
          # writing an HTTP error message as the SVG's literal content) if
          # shields.io is ever unreachable or rate-limits the runner.
          genbadge coverage -i coverage.xml -o badges/coverage-badge.svg --local
          genbadge tests -i pytest-results.xml -o badges/tests-badge.svg --local

      - name: Commit updated badges
        if: always() && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage and test badges [skip ci]"
          file_pattern: badges/*.svg
