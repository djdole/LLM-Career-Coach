name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: ["**"]

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        id: run_tests
        # --testmon-noselect: pytest.ini defaults bare `pytest` to
        # --testmon (only run tests affected by changed code, for fast
        # local iteration - see USAGE.md's "Running tests" section).
        # CI needs the opposite guarantee: every test, every run, so
        # coverage%, badges, and the PR comment below stay accurate and
        # a change can't accidentally slip past testmon's dependency
        # tracking. --testmon-noselect keeps the plugin active (so the
        # --testmon flag baked into pytest.ini's addopts stays valid --
        # disabling the plugin outright via `-p no:pytest-testmon`
        # instead makes pytest error on that flag) but forces it back
        # to running everything, the same as if testmon weren't
        # involved at all.
        run: |
          pytest -q \
            --testmon-noselect \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: pytest results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 14

      - name: Code coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "60 80"

      - name: Post coverage summary to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Sync branch to latest before generating badges
        if: always() && github.event_name == 'push' && steps.run_tests.outcome != 'skipped'
        run: |
          git fetch origin "${{ github.ref_name }}"
          git merge --ff-only "origin/${{ github.ref_name }}"

      - name: Generate coverage and test badges
        if: always() && github.event_name == 'push' && steps.run_tests.outcome != 'skipped'
        run: |
          mkdir -p badges
          genbadge coverage -i coverage.xml -o badges/coverage-badge.svg --local
          genbadge tests -i pytest-results.xml -o badges/tests-badge.svg --local

      - name: Commit updated badges
        if: always() && github.event_name == 'push' && steps.run_tests.outcome != 'skipped'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage and test badges [skip ci]"
          file_pattern: badges/*.svg
          skip_fetch: true