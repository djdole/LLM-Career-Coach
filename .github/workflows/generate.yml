name: Generate Files
on:
  push:
    branches: [main]
    paths:
      # Only fires for a LOCAL KNOWLEDGE_BASE at its default path - see
      # the TRIGGER LIMITATION note above if yours is a URL instead.
      - "data/profile.json"
  workflow_dispatch: {} # allows manually re-running from the Actions tab
  repository_dispatch:
    # Fired by another repo's repository-dispatch-trigger.yml (once
    # copied there and enabled) sending this event type. Note:
    # poll-target-repo.yml triggers this workflow via `gh workflow run`
    # instead, which uses the workflow_dispatch trigger above, not this
    # one. Rename here and in repository-dispatch-trigger.yml together
    # if you change the event type.
    types: [career-coach-source-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-resumes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest # see network reachability note above before changing to self-hosted
    timeout-minutes: 360
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check LiteLLM is reachable
        # Fails fast with the actual cause, instead of the generator's generic
        # "Connection error.", if the LiteLLM proxy (or the reverse proxy in
        # front of it) can't be reached from the runner. Only the HTTP status
        # or curl's exit code is printed, never curl's own error text: that
        # text contains the bare hostname, which GitHub does not mask even
        # when LITELLM_BASE_URL is a secret, and this repo's logs are public.
        # Skip it by setting the repo variable LITELLM_PREFLIGHT to "false".
        if: ${{ vars.LITELLM_PREFLIGHT != 'false' }}
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL || 'http://localhost:4000' }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || vars.LITELLM_API_KEY || '' }}
        run: |
          set +e
          status=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            "${LITELLM_BASE_URL%/}/v1/models" 2>/dev/null)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            case "$status" in
              2??)
                echo "LiteLLM is reachable (HTTP $status)."
                exit 0 ;;
              401|403)
                echo "::error::LiteLLM is reachable but rejected the API key (HTTP $status). Check the LITELLM_API_KEY secret."
                exit 1 ;;
              *)
                echo "::error::LiteLLM answered /v1/models with HTTP $status: the proxy is up but LiteLLM (or what is behind it) is not healthy. To skip this check, set the repo variable LITELLM_PREFLIGHT to false."
                exit 1 ;;
            esac
          fi
          case "$rc" in
            3)  why="LITELLM_BASE_URL is malformed" ;;
            6)  why="DNS could not resolve the host (wrong hostname, or stale dynamic DNS)" ;;
            7)  why="connection refused (port forward missing, LiteLLM or the proxy is down, or the port is wrong)" ;;
            28) why="connection timed out (a firewall or ISP is dropping packets, or the host is off)" ;;
            35|51|60|83) why="TLS handshake or certificate failure (expired or mismatched certificate, or http/https mixed up)" ;;
            52|56) why="the connection was closed or reset by the server or proxy" ;;
            *)  why="curl could not complete the request" ;;
          esac
          echo "::error::Cannot reach LiteLLM: $why (curl exit code $rc)."
          exit 1

      - name: Generate baseline outputs
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL || 'http://localhost:4000' }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || vars.LITELLM_API_KEY || '' }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL || vars.LITELLM_MODEL || 'qwen3.6:latest' }}
          KNOWLEDGE_BASE: ${{ secrets.KNOWLEDGE_BASE || vars.KNOWLEDGE_BASE || 'data/profile.json' }}
          KNOWLEDGE_BASE_URL_TOKEN: ${{ secrets.KNOWLEDGE_BASE_URL_TOKEN || vars.KNOWLEDGE_BASE_URL_TOKEN || '' }}
          LITELLM_MAX_TOKENS: ${{ secrets.LITELLM_MAX_TOKENS || vars.LITELLM_MAX_TOKENS || '10000' }}
          OLLAMA_NUM_CTX: ${{ secrets.OLLAMA_NUM_CTX || vars.OLLAMA_NUM_CTX || '16384' }}
          LITELLM_TIMEOUT: ${{ secrets.LITELLM_TIMEOUT || vars.LITELLM_TIMEOUT || '550' }}
          LITELLM_KEEP_ALIVE: ${{ secrets.LITELLM_KEEP_ALIVE || vars.LITELLM_KEEP_ALIVE || '30m' }}
          VARIANTS: ${{ secrets.VARIANTS || vars.VARIANTS || '["GENERIC", "SDE", "SDET"]' }}
          OUTPUT_FOLDER: ${{ secrets.OUTPUT_FOLDER || vars.OUTPUT_FOLDER || 'generated' }}
          OUTPUT_REPO: ${{ secrets.OUTPUT_REPO || vars.OUTPUT_REPO || 'https://github.com/YOUR_USERNAME/your-resumes.git' }}
          OUTPUT_REPO_BRANCH: ${{ secrets.OUTPUT_REPO_BRANCH || vars.OUTPUT_REPO_BRANCH || '' }}
          OUTPUT_REPO_USER: ${{ secrets.OUTPUT_REPO_USER || vars.OUTPUT_REPO_USER || '' }}
          OUTPUT_REPO_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN || vars.OUTPUT_REPO_TOKEN || 'ghp_...' }}
          OUTPUT_REPO_CLONE_DIR: ${{ secrets.OUTPUT_REPO_CLONE_DIR || vars.OUTPUT_REPO_CLONE_DIR || '.output-repo' }}
          OUTPUT_REPO_AUTHOR_NAME: ${{ secrets.OUTPUT_REPO_AUTHOR_NAME || vars.OUTPUT_REPO_AUTHOR_NAME || 'LLM-Career-Coach' }}
          OUTPUT_REPO_AUTHOR_EMAIL: ${{ secrets.OUTPUT_REPO_AUTHOR_EMAIL || vars.OUTPUT_REPO_AUTHOR_EMAIL || 'LLM-Career-Coach@users.noreply.github.com' }}
          OUTPUT_REPO_COMMIT_MESSAGE: ${{ secrets.OUTPUT_REPO_COMMIT_MESSAGE || vars.OUTPUT_REPO_COMMIT_MESSAGE || 'Regenerate resumes/cover letters ({datetime.now})' }}
          OUTPUT_REPO_PUSH: ${{ secrets.OUTPUT_REPO_PUSH || vars.OUTPUT_REPO_PUSH || 'false' }}
          KNOWLEDGE_BASE_DRAFT: ${{ secrets.KNOWLEDGE_BASE_DRAFT || vars.KNOWLEDGE_BASE_DRAFT || 'data/profile.json' }}
          DATA: ${{ secrets.DATA || vars.DATA || 'data' }}
          README_TEMPLATE: ${{ secrets.README_TEMPLATE || vars.README_TEMPLATE || 'README.template.md' }}
          README_OUTPUT: ${{ secrets.README_OUTPUT || vars.README_OUTPUT || 'README.md' }}
          EMAIL_TAG_ADDRESS: ${{ secrets.EMAIL_TAG_ADDRESS || vars.EMAIL_TAG_ADDRESS || 'githubcom-profile' }}
          RESUME_TEMPLATE: ${{ secrets.RESUME_TEMPLATE || vars.RESUME_TEMPLATE || 'RESUME.template.md' }}
          RESUME_NAMING_TEMPLATE: ${{ secrets.RESUME_NAMING_TEMPLATE || vars.RESUME_NAMING_TEMPLATE || '<{JobAcronym}/>{FirstName} {LastName} Resume< ({JobAcronym})>.{Extension}' }}
          COVERLETTER_NAMING_TEMPLATE: ${{ secrets.COVERLETTER_NAMING_TEMPLATE || vars.COVERLETTER_NAMING_TEMPLATE || '<{JobAcronym}/>{FirstName} {LastName} Cover Letter< ({JobAcronym})>.{Extension}' }}
          ANALYSIS_NAMING_TEMPLATE: ${{ secrets.ANALYSIS_NAMING_TEMPLATE || vars.ANALYSIS_NAMING_TEMPLATE || '{FirstName} {LastName} Job Fit Analysis.{Extension}' }}
          ANALYSIS_PROMPT_TEMPLATE: ${{ secrets.ANALYSIS_PROMPT_TEMPLATE || vars.ANALYSIS_PROMPT_TEMPLATE || 'ANALYSIS_PROMPT.template.txt' }}

        run: python generator.py

      - name: Open pull request with regenerated files
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL || 'http://localhost:4000' }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || vars.LITELLM_API_KEY || '' }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL || vars.LITELLM_MODEL || 'qwen3.6:latest' }}
          KNOWLEDGE_BASE: ${{ secrets.KNOWLEDGE_BASE || vars.KNOWLEDGE_BASE || 'data/profile.json' }}
          KNOWLEDGE_BASE_URL_TOKEN: ${{ secrets.KNOWLEDGE_BASE_URL_TOKEN || vars.KNOWLEDGE_BASE_URL_TOKEN || '' }}
          LITELLM_MAX_TOKENS: ${{ secrets.LITELLM_MAX_TOKENS || vars.LITELLM_MAX_TOKENS || '10000' }}
          OLLAMA_NUM_CTX: ${{ secrets.OLLAMA_NUM_CTX || vars.OLLAMA_NUM_CTX || '16384' }}
          LITELLM_TIMEOUT: ${{ secrets.LITELLM_TIMEOUT || vars.LITELLM_TIMEOUT || '550' }}
          LITELLM_KEEP_ALIVE: ${{ secrets.LITELLM_KEEP_ALIVE || vars.LITELLM_KEEP_ALIVE || '30m' }}
          VARIANTS: ${{ secrets.VARIANTS || vars.VARIANTS || '["GENERIC", "SDE", "SDET"]' }}
          OUTPUT_FOLDER: ${{ secrets.OUTPUT_FOLDER || vars.OUTPUT_FOLDER || 'generated' }}
          OUTPUT_REPO: ${{ secrets.OUTPUT_REPO || vars.OUTPUT_REPO || 'https://github.com/YOUR_USERNAME/your-resumes.git' }}
          OUTPUT_REPO_BRANCH: ${{ secrets.OUTPUT_REPO_BRANCH || vars.OUTPUT_REPO_BRANCH || '' }}
          OUTPUT_REPO_USER: ${{ secrets.OUTPUT_REPO_USER || vars.OUTPUT_REPO_USER || '' }}
          OUTPUT_REPO_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN || vars.OUTPUT_REPO_TOKEN || 'ghp_...' }}
          OUTPUT_REPO_CLONE_DIR: ${{ secrets.OUTPUT_REPO_CLONE_DIR || vars.OUTPUT_REPO_CLONE_DIR || '.output-repo' }}
          OUTPUT_REPO_AUTHOR_NAME: ${{ secrets.OUTPUT_REPO_AUTHOR_NAME || vars.OUTPUT_REPO_AUTHOR_NAME || 'LLM-Career-Coach' }}
          OUTPUT_REPO_AUTHOR_EMAIL: ${{ secrets.OUTPUT_REPO_AUTHOR_EMAIL || vars.OUTPUT_REPO_AUTHOR_EMAIL || 'LLM-Career-Coach@users.noreply.github.com' }}
          OUTPUT_REPO_COMMIT_MESSAGE: ${{ secrets.OUTPUT_REPO_COMMIT_MESSAGE || vars.OUTPUT_REPO_COMMIT_MESSAGE || 'Regenerate resumes/cover letters ({datetime.now})' }}
          OUTPUT_REPO_PUSH: ${{ secrets.OUTPUT_REPO_PUSH || vars.OUTPUT_REPO_PUSH || 'false' }}
          KNOWLEDGE_BASE_DRAFT: ${{ secrets.KNOWLEDGE_BASE_DRAFT || vars.KNOWLEDGE_BASE_DRAFT || 'data/profile.json' }}
          DATA: ${{ secrets.DATA || vars.DATA || 'data' }}
          README_TEMPLATE: ${{ secrets.README_TEMPLATE || vars.README_TEMPLATE || 'README.template.md' }}
          README_OUTPUT: ${{ secrets.README_OUTPUT || vars.README_OUTPUT || 'README.md' }}
          EMAIL_TAG_ADDRESS: ${{ secrets.EMAIL_TAG_ADDRESS || vars.EMAIL_TAG_ADDRESS || 'githubcom-profile' }}
          RESUME_TEMPLATE: ${{ secrets.RESUME_TEMPLATE || vars.RESUME_TEMPLATE || 'RESUME.template.md' }}
          RESUME_NAMING_TEMPLATE: ${{ secrets.RESUME_NAMING_TEMPLATE || vars.RESUME_NAMING_TEMPLATE || '<{JobAcronym}/>{FirstName} {LastName} Resume< ({JobAcronym})>.{Extension}' }}
          COVERLETTER_NAMING_TEMPLATE: ${{ secrets.COVERLETTER_NAMING_TEMPLATE || vars.COVERLETTER_NAMING_TEMPLATE || '<{JobAcronym}/>{FirstName} {LastName} Cover Letter< ({JobAcronym})>.{Extension}' }}
          ANALYSIS_NAMING_TEMPLATE: ${{ secrets.ANALYSIS_NAMING_TEMPLATE || vars.ANALYSIS_NAMING_TEMPLATE || '{FirstName} {LastName} Job Fit Analysis.{Extension}' }}
          ANALYSIS_PROMPT_TEMPLATE: ${{ secrets.ANALYSIS_PROMPT_TEMPLATE || vars.ANALYSIS_PROMPT_TEMPLATE || 'ANALYSIS_PROMPT.template.txt' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Regenerate resumes and cover letter from updated knowledge base"
          branch: auto/regenerate-resumes
          delete-branch: true
          title: "Auto: regenerate resumes/cover letter from the knowledge base"
          body: |
            Generated via self-hosted LiteLLM/Ollama (model: ${{ vars.LITELLM_MODEL }}).
            This PR was opened automatically and was **not** reviewed by a human yet.
            Please read the diff in `generated/` before merging: local-model output
            can drift more than a hosted model's - worth a closer skim than usual.
          labels: automated-pr
