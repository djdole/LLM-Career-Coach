# Polls a *different* repo every 30 minutes for changes to a configured
# list of files/folders, and if anything changed since the last run,
# triggers this repo's generate.yml (via workflow_dispatch).
#
# This exists for the case where your KNOWLEDGE_BASE lives elsewhere (a
# separate "source of truth" repo) and pushes to it can't natively fire
# generate.yml's own `push`/`paths` trigger, which only watches this repo.
# See the companion `repository-dispatch-trigger.yml.disabled` for a
# push-based (near-instant) alternative you can check into that other
# repo instead of, or in addition to, this polling workflow.
#
# HOW "CHANGED" IS DETECTED: no state is stored anywhere. Each run asks
# the GitHub API "were there any commits touching this path in the last
# POLL_TARGET_LOOKBACK_MINUTES minutes?" (via the commits endpoint's
# `since` filter). That means this workflow never needs to write
# anything back to this repo (or anywhere else) - no state file, no
# extra branch, no `contents: write` permission.
#
# TRADE-OFF, on purpose: POLL_TARGET_LOOKBACK_MINUTES (default 40) is
# set a bit longer than the 30-minute schedule so consecutive windows
# overlap. GitHub's cron schedules aren't guaranteed to fire exactly on
# time (they can run a few minutes late under load), so the overlap
# exists to make sure a change never falls in the gap between one run's
# window and the next. Worst case with overlap is a harmless extra
# check of an already-seen commit (generate.yml opening a PR with an
# empty diff is a no-op for peter-evans/create-pull-request). This does
# NOT protect against a run being skipped entirely for longer than the
# lookback window - e.g. GitHub auto-disables scheduled workflows after
# 60 days with no repository activity. If that's ever happened, run
# this workflow manually (workflow_dispatch) with
# POLL_TARGET_LOOKBACK_MINUTES set generously to catch up.
#
# ---------------------------------------------------------------------
# ONE-TIME SETUP (Settings > Secrets and variables > Actions)
#   Each of these can be set as either a repository Variable or a
#   repository Secret - secrets win if both are set. Use a Variable
#   unless the value itself is sensitive (none of these need to be).
#     POLL_TARGET_REPO   "owner/repo" of the repo to watch, e.g.
#                        "YOUR_USERNAME/career-coach-source"
#     POLL_TARGET_REF    Branch/ref to watch on that repo. Default: "main"
#     POLL_TARGET_PATHS  List of files/folders to watch, one per line
#                        (or comma-separated), relative to the target
#                        repo's root, e.g.:
#                          data/profile.json
#                          data/knowledge-base/
#     POLL_TARGET_LOOKBACK_MINUTES
#                        How far back to look for commits each run.
#                        Default: 40 (30-minute schedule + 10-minute
#                        buffer for scheduling jitter). Keep this
#                        comfortably above the cron interval.
#     GENERATE_WORKFLOW_REF
#                        Branch to run generate.yml on when triggered.
#                        Default: this repo's default branch. Variable
#                        only (no secret fallback).
#   Secret only (never a plain variable):
#     POLL_TARGET_REPO_TOKEN
#                        A PAT with read access to the target repo.
#                        Required if that repo is private; a
#                        fine-grained token scoped to "Contents:
#                        read-only" on just that repo is enough. May be
#                        left unset for a public target repo (subject
#                        to GitHub's lower unauthenticated API rate
#                        limit).
#
# No token setup is needed to trigger generate.yml itself - that uses
# this workflow's own GITHUB_TOKEN, since it's dispatching a workflow
# in the same repo (see the "actions: write" permission below).
# ---------------------------------------------------------------------

name: Poll Target Repo for Changes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # allows manually re-running / testing from the Actions tab

permissions:
  contents: read
  actions: write # to dispatch generate.yml

concurrency:
  group: poll-target-repo
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check target repo paths for recent commits
        id: poll
        env:
          GH_API_TOKEN: ${{ secrets.POLL_TARGET_REPO_TOKEN }}
          TARGET_REPO: ${{ secrets.POLL_TARGET_REPO || vars.POLL_TARGET_REPO }}
          TARGET_REF: ${{ secrets.POLL_TARGET_REF || vars.POLL_TARGET_REF || 'main' }}
          WATCH_PATHS: ${{ secrets.POLL_TARGET_PATHS || vars.POLL_TARGET_PATHS || 'data/profile.json' }}
          LOOKBACK_MINUTES: ${{ secrets.POLL_TARGET_LOOKBACK_MINUTES || vars.POLL_TARGET_LOOKBACK_MINUTES || '40' }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_REPO:-}" ]; then
            echo "::error::POLL_TARGET_REPO is not set (Settings > Secrets and variables > Actions). Nothing to poll."
            exit 1
          fi

          since="$(date -u -d "@$(( $(date -u +%s) - LOOKBACK_MINUTES * 60 ))" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Looking for commits since ${since} (${LOOKBACK_MINUTES} minute lookback)."

          auth_header=()
          if [ -n "${GH_API_TOKEN:-}" ]; then
            auth_header=(-H "Authorization: token ${GH_API_TOKEN}")
          fi

          # Normalize WATCH_PATHS: allow comma- or newline-separated lists,
          # trim whitespace, drop blanks.
          mapfile -t watch_paths < <(printf '%s' "$WATCH_PATHS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')

          if [ "${#watch_paths[@]}" -eq 0 ]; then
            echo "::error::POLL_TARGET_PATHS resolved to an empty list of paths to watch."
            exit 1
          fi

          changed="false"

          for path in "${watch_paths[@]}"; do
            echo "Checking ${TARGET_REPO}@${TARGET_REF}: ${path}"

            response="$(curl -sS -G \
              "${auth_header[@]}" \
              -H "Accept: application/vnd.github+json" \
              --data-urlencode "sha=${TARGET_REF}" \
              --data-urlencode "path=${path}" \
              --data-urlencode "since=${since}" \
              --data-urlencode "per_page=1" \
              "https://api.github.com/repos/${TARGET_REPO}/commits")"

            if echo "$response" | jq -e 'type == "object" and has("message")' >/dev/null 2>&1; then
              msg="$(echo "$response" | jq -r '.message')"
              echo "::warning::GitHub API error for path '${path}': ${msg}"
              continue
            fi

            hit_sha="$(echo "$response" | jq -r '.[0].sha // empty')"

            if [ -n "$hit_sha" ]; then
              echo "  -> recent commit found (${hit_sha})"
              changed="true"
            else
              echo "  -> no commits in window"
            fi
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "target_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"

      - name: Trigger generate.yml
        if: steps.poll.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_REF: ${{ vars.GENERATE_WORKFLOW_REF || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "Change detected in watched paths on ${{ steps.poll.outputs.target_repo }} - dispatching generate.yml on ${RUN_REF}"
          gh workflow run generate.yml --repo "${{ github.repository }}" --ref "$RUN_REF"